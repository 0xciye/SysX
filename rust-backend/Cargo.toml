[package]
name = "sysx-backend"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false

[lib]
name = "sysx_backend"
path = "src/lib.rs"

[features]
default = []
tensorrt = ["dep:baracuda-driver", "dep:baracuda-tensorrt"]
tensorrt-shim = ["tensorrt", "baracuda-tensorrt/shim"]

[[bin]]
name = "receiver-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
half = "2"
# Object Detection dependencies: retained for development, not ready for use.
# Pixel Seek is the only currently available detection engine.
openvino = { version = "0.11.1", features = ["runtime-linking"] }
ort = "2.0.0-rc.14"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
socket2 = "0.6"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
# TensorRT development adapter is also unavailable for use.
baracuda-driver = { version = "0.0.1-alpha.94", optional = true }
baracuda-tensorrt = { version = "0.0.1-alpha.94", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }
