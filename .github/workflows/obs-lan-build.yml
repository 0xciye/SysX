name: Build OBS DLL (manual, receiver IP)
on:
  workflow_dispatch:
    inputs:
      receiver_ip:
        description: 'Receiver IPv4 address (UDP 4200)'
        required: true
        default: '192.168.88.59'
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RECEIVER_IP: ${{ inputs.receiver_ip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate receiver IPv4 input
        shell: pwsh
        run: |
          $ip = $null
          if ($env:RECEIVER_IP -notmatch '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$' -or
              -not [Net.IPAddress]::TryParse($env:RECEIVER_IP, [ref]$ip) -or
              $ip.AddressFamily -ne [Net.Sockets.AddressFamily]::InterNetwork -or
              $ip.ToString() -ne $env:RECEIVER_IP) {
            throw 'Enter a canonical IPv4 address, for example 192.168.88.59.'
          }
      - name: Prepare OBS headers and static JPEG SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/obs-source, work/obs-config, work/downloads | Out-Null
          gh release download 32.2.2 --repo obsproject/obs-studio --pattern OBS-Studio-32.2.2-Sources.tar.gz --dir work/downloads
          if ($LASTEXITCODE -ne 0) { throw 'OBS source download failed' }
          tar -xzf work/downloads/OBS-Studio-32.2.2-Sources.tar.gz -C work/obs-source
          if ($LASTEXITCODE -ne 0) { throw 'OBS source extraction failed' }
          "#pragma once`n#define OBS_RELEASE_CANDIDATE 0`n#define OBS_BETA 0" | Set-Content work/obs-config/obsconfig.h -Encoding ascii
          gh release download 3.2.0 --repo libjpeg-turbo/libjpeg-turbo --pattern libjpeg-turbo-3.2.0-vc-x64.exe --dir work/downloads
          if ($LASTEXITCODE -ne 0) { throw 'JPEG SDK download failed' }
          $installer = Start-Process (Resolve-Path work/downloads/libjpeg-turbo-3.2.0-vc-x64.exe) -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'JPEG SDK install failed' }
      - name: Compile DLL and self-test with static dependencies
        shell: pwsh
        run: |
          $headers = (Get-ChildItem work/obs-source -Recurse -Filter obs-module.h | Select-Object -First 1).DirectoryName
          ./scripts/build-obs-plugin.ps1 -ObsInclude "$headers;$PWD/work/obs-config" -ReceiverIp $env:RECEIVER_IP -BuildSelfTest
      - name: Check exports, packets, crop reply and Windows DLL imports
        shell: pwsh
        run: |
          python scripts/check-obs-sender.py dist-package/OBS-plugin/sysx-canvas-sender.dll work/obs-build-release/sysx-sender-selftest.exe $env:RECEIVER_IP | Tee-Object dist-package/OBS-plugin/validation.json
          if ($LASTEXITCODE -ne 0) { throw 'Sender smoke failed' }
          python scripts/check-windows-symbols.py dist-package/OBS-plugin/sysx-canvas-sender.dll dist-symbols/obs/sysx-canvas-sender.pdb
          if ($LASTEXITCODE -ne 0) { throw 'OBS PDB mismatch' }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio lookup failed' }
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Select-Object -Last 1
          $imports = & $dumpbin.FullName /DEPENDENTS dist-package/OBS-plugin/sysx-canvas-sender.dll
          if ($LASTEXITCODE -ne 0) { throw 'DLL import audit failed' }
          $imports | Set-Content dist-package/OBS-plugin/imports.txt
          $dependencies = @($imports | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() })
          if (-not $dependencies.Count) { throw 'No DLL imports found' }
          $unexpected = @($dependencies | Where-Object { $_ -notin @('KERNEL32.dll', 'WS2_32.dll') })
          if ($unexpected.Count) { throw "Unexpected dependency: $unexpected" }
      - name: Save DLL in a draft release
        shell: pwsh
        run: |
          $dll = Get-Item dist-package/OBS-plugin/sysx-canvas-sender.dll
          "$((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant())  $($dll.Name)" | Set-Content "$($dll.FullName).sha256" -Encoding ascii
          Compress-Archive -Path dist-symbols/obs -DestinationPath dist-package/OBS-plugin/OBS-symbols.zip -Force
          "Receiver: $($env:RECEIVER_IP):4200" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist-package/OBS-plugin/sysx-canvas-sender.dll, dist-package/OBS-plugin/OBS-symbols.zip | ForEach-Object {
            "$($_.Name): $($_.Length) bytes" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          gh release create "obs-lan-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" 'dist-package/OBS-plugin/sysx-canvas-sender.dll' 'dist-package/OBS-plugin/sysx-canvas-sender.dll.sha256' 'dist-package/OBS-plugin/OBS-symbols.zip' 'dist-package/OBS-plugin/validation.json' 'dist-package/OBS-plugin/imports.txt' --draft --prerelease --target $env:GITHUB_SHA --title "SysX OBS sender $($env:RECEIVER_IP):4200" --notes 'Windows x64. Separate PDB archive. OBS 32.2.2 headers. Static JPEG and CRT. Headless loopback validation only; real OBS graphics and LAN delivery are not validated.'
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
