[package]
name = "receiver"
version = "0.1.0"
description = "SysX native host: backend, device I/O and receiver window launcher"
authors = ["Receiver"]
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false

[build-dependencies]

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
medius = "3.4.3"
tao = "0.37.1"
wry = "0.57.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sha2 = "0.11"

[dev-dependencies]
medius = { version = "3.4.3", features = ["mock"] }
