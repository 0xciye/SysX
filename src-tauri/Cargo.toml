[package]
name = "receiver"
version = "0.1.0"
description = "Realtime computer vision receiver desktop app"
authors = ["Receiver"]
edition = "2021"

[lib]
name = "receiver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
medius = "3.4.3"
serialport = { version = "4", default-features = false }

