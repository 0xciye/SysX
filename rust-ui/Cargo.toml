[package]
name = "sysx-ui"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3"
futures-channel = "0.3"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8.14", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "Blob",
  "Crypto",
  "DomRect",
  "Document",
  "Event",
  "Element",
  "File",
  "FileList",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "ImageBitmap",
  "HtmlSelectElement",
  "Location",
  "MessageEvent",
  "Performance",
  "ResizeObserver",
  "Storage",
  "TextMetrics",
  "Url",
  "UrlSearchParams",
  "WebSocket",
  "Window",
] }
