<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0d0f" />
    <title>SysX</title>
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="copy-file" href="../public/receiver-mark.svg" />
    <link data-trunk rel="copy-file" href="../public/sysx-boot.js" />
    <link data-trunk rel="copy-file" href="../public/sysx-loader.js" />
  </head>
  <body>
    <div id="sysx-boot-fallback" style="min-height:100vh;display:grid;place-items:center;background:#0a0d0f;color:#e6ebec;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <section style="width:min(640px,calc(100vw - 32px),calc(100vh - 150px));aspect-ratio:1;border:1px solid #2b3336;border-radius:7px;background:#101315;overflow:hidden;display:flex;flex-direction:column">
        <header style="height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #282e31">
          <strong style="font-weight:500">SysX</strong><span style="color:#d9b763;font-size:11px">Starting receiver</span>
        </header>
        <div style="flex:1;min-height:0;display:grid;place-items:center;background:#080a0b;color:#a6b0b3;gap:10px;align-content:center">
          <span style="padding:4px 7px;border:1px solid #394346;border-radius:3px;color:#aab6b9;font:9px monospace;letter-spacing:.08em">NO FRAME</span>
          <span>Waiting for the Rust receiver to start</span>
        </div>
        <footer style="height:58px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 14px;border-top:1px solid #282e31;color:#a6b0b3;font-size:10px">
          <span>FPS<br><strong style="color:#e6ebec;font:12px monospace">—</strong></span><span>Latency<br><strong style="color:#e6ebec;font:12px monospace">—</strong></span><span>Resolution<br><strong style="color:#e6ebec;font:12px monospace">—</strong></span>
        </footer>
      </section>
    </div>
    <script src="./sysx-loader.js"></script>
    <link data-trunk rel="rust" href="Cargo.toml" />
  </body>
</html>
