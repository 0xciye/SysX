[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "receiver-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6.0,<7",
  "websockets>=14,<16",
]

[project.optional-dependencies]
inference = ["ultralytics>=8.3,<9"]
dev = ["pytest>=8.0,<9"]
package = ["ultralytics>=8.3,<9", "pyinstaller>=6.10,<7"]

[project.scripts]
receiver-backend = "receiver_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
